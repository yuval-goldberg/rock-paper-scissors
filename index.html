<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 class="head-title">Rock Paper Scissors</h1>
    <p class="sub-title">Select Rock / Paper / Scissors and play agaisnt the computer up to 5 points!</p>
    <div class="option-selector">
        <button class="option-btn" id="rock">🪨</button>
        <button class="option-btn" id="paper">🧻</button>
        <button class="option-btn" id="scissors">✂️</button>
    </div>
    <div class="round-container">
        <button class="play-btn">Play</button>
    </div>
    <div class="result-container">
        <div class="result">
            <h2>You</h2>
            <h2 class="score" id="user-score">0</h2>
        </div>
        <div class="result">
            <h2>Computer</h2>
            <h2 class="score" id="computer-score">0</h2>
        </div>
    </div>
</body>

</html>
